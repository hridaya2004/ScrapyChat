apiVersion: apps/v1
kind: Deployment
metadata:
  name: scrapychat-backend
  labels:
    app: scrapychat-backend
spec:
  selector:
    matchLabels:
      app: scrapychat-backend
  template:
    metadata:
      labels:
        app: scrapychat-backend
    spec:
      containers:
        - name: scrapychat-backend
          image: ghcr.io/hridaya2004/scrapychat/scrapychat-backend:5b224d3dfec7c8906a80fe53c97f383af992ead2
          ports:
            - containerPort: 8080
          env:
            - name: OTEL_SERVICE_NAME
              value: scrapychat-backend-service
          envFrom:
            - configMapRef:
                name: scrapychat-backend-configmap
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
