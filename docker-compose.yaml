services:
  backend:
    image: scrapychat-fastapi
    container_name: scrapychat-backend
    environment:
      QDRANT_ENDPOINT: http://qdrant:6333
    env_file: .env
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  qdrant:
    image: qdrant/qdrant:latest
    restart: always
    container_name: qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    expose:
      - 6333
      - 6334
      - 6335
    configs:
      - source: qdrant_config
        target: /qdrant/config/production.yaml
    volumes:
      - ./qdrant_data:/qdrant/storage:z

configs:
  qdrant_config:
    content: |
      log_level: INFO
