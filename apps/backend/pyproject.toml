[project]
name = "scrapychat"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "cryptography>=46.0.7",
    "fastapi>=0.127.0",
    "httpx>=0.28.1",
    "llama-index-embeddings-ollama>=0.8.5",
    "llama-index-llms-google-genai>=0.8.3",
    "llama-index-vector-stores-qdrant>=0.9.0",
    "playwright>=1.57.0",
    "pyjwt>=2.10.1",
    "redis[hiredis]>=7.1.0",
    "uvicorn>=0.40.0",
]

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]

[dependency-groups]
dev = [
    "nox>=2025.11.12",
    "pyrefly>=0.46.1",
    "ruff>=0.14.10",
]
