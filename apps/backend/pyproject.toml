[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[project]
name = "scrapychat"
dynamic = ["version"]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "crawl4ai>=0.8.9",
    "cryptography>=48.0.0",
    "fastapi>=0.136.3",
    "httpx>=0.28.1",
    "llama-index-embeddings-ollama>=0.9.0",
    "llama-index-llms-google-genai>=0.9.5",
    "llama-index-vector-stores-qdrant>=0.10.1",
    "pyjwt>=2.13.0",
    "redis[hiredis]>=8.0.0",
    "uvicorn>=0.49.0",
]

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]

[dependency-groups]
dev = [
    "nox>=2026.4.10",
    "pyrefly>=1.0.0",
    "ruff>=0.15.16",
]
