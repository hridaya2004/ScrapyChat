[project]
name = "scrapychat"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "cryptography>=48.0.0",
    "fastapi>=0.136.3",
    "httpx>=0.28.1",
    "llama-index-embeddings-ollama>=0.9.0",
    "llama-index-llms-google-genai>=0.9.5",
    "llama-index-vector-stores-qdrant>=0.10.1",
    "playwright>=1.60.0",
    "pyjwt>=2.13.0",
    "redis[hiredis]>=8.0.0",
    "uvicorn>=0.49.0",
]

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]

[dependency-groups]
dev = [
    "nox>=2026.4.10",
    "pyrefly>=1.0.0",
    "ruff>=0.15.16",
]
