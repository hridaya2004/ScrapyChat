name: Publish Docker Images

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: web
            context: .
            file: apps/web/Dockerfile
          - name: auth
            context: .
            file: apps/auth/Dockerfile
          - name: migrate
            context: .
            file: apps/auth/Dockerfile.migrate
          - name: backend
            context: .
            file: apps/backend/Dockerfile

    permissions:
      contents: read
      id-token: write
      packages: write

    steps:
      - name: Extract version from tag
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Compute image tag
        id: image_tag
        run: echo "value=${{ steps.version.outputs.value }}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/github-builder/.github/workflows/build.yml@v1
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          job-name-prefix: ${{ matrix.name }}
          output: image
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: APP_VERSION=${{ steps.version.outputs.value }}
          cache: true
          cache-scope: ${{ matrix.name }}
          sbom: true
          set-meta-labels: true
          set-meta-annotations: true
          meta-images: ${{ env.REGISTRY }}/${{ github.repository }}/scrapychat-${{ matrix.name }}
          meta-tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=match,pattern=^v?(.*)$,group=1
            type=sha,format=short
            type=raw,value=${{ steps.image_tag.outputs.value }}
            type=raw,value=latest,enable={{is_default_branch}}
        secrets:
          registry-auths: |
            - registry: ghcr.io
              username: ${{ github.actor }}
              password: ${{ secrets.GITHUB_TOKEN }}

  update-manifests:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Extract version from tag
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Compute image tag
        id: image_tag
        run: echo "value=${{ steps.version.outputs.value }}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Update image tags
        run: |
          yq -i ".spec.template.spec.containers[0].image = \"ghcr.io/hridaya2004/scrapychat/scrapychat-web:${{ steps.image_tag.outputs.value }}\"" k8s/web/deployment.yaml
          yq -i ".spec.template.spec.containers[0].image = \"ghcr.io/hridaya2004/scrapychat/scrapychat-auth:${{ steps.image_tag.outputs.value }}\"" k8s/auth/deployment.yaml
          yq -i ".spec.template.spec.initContainers[0].image = \"ghcr.io/hridaya2004/scrapychat/scrapychat-migrate:${{ steps.image_tag.outputs.value }}\"" k8s/auth/deployment.yaml
          yq -i ".spec.template.spec.containers[0].image = \"ghcr.io/hridaya2004/scrapychat/scrapychat-backend:${{ steps.image_tag.outputs.value }}\"" k8s/backend/deployment.yaml

      - name: Commit to repo
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          commit_message: "k8s: Bump images to ${{ steps.image_tag.outputs.value }} [no ci]"
          file_pattern: "k8s/**/deployment.yaml"
