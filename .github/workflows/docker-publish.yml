name: Publish Docker Images

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-slim
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Compute version and image tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${version}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: web
            dockerfile: apps/web/Dockerfile
          - name: auth
            dockerfile: apps/auth/Dockerfile
          - name: migrate
            dockerfile: apps/auth/Dockerfile.migrate
          - name: backend
            dockerfile: apps/backend/Dockerfile
            build-args: BUILDKIT_CONTEXT_KEEP_GIT_DIR=1
    uses: docker/github-builder/.github/workflows/build.yml@v1
    permissions:
      contents: read
      id-token: write
      packages: write
    with:
      context: .
      file: ${{ matrix.service.dockerfile }}
      build-args: |
        APP_VERSION=${{ needs.prepare.outputs.version }}
        ${{ matrix.service.build-args }}
      output: image
      push: true
      platforms: linux/amd64
      cache: true
      cache-scope: ${{ matrix.service.name }}
      sbom: true
      set-meta-labels: true
      set-meta-annotations: true
      meta-images: ghcr.io/${{ github.repository }}/scrapychat-${{ matrix.service.name }}
      meta-tags: |
        type=semver,pattern={{version}}
        type=semver,pattern={{major}}.{{minor}}
        type=match,pattern=^v?(.*)$,group=1
        type=sha,format=short
        type=raw,value=${{ needs.prepare.outputs.tag }}
        type=raw,value=latest,enable={{is_default_branch}}
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  update-manifests:
    runs-on: ubuntu-slim
    needs: [prepare, build]
    permissions:
      contents: write
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Update image tags
        run: |
          yq -i ".spec.template.spec.containers[0].image = \"ghcr.io/hridaya2004/scrapychat/scrapychat-web:${TAG}\"" k8s/web/deployment.yaml
          yq -i ".spec.template.spec.containers[0].image = \"ghcr.io/hridaya2004/scrapychat/scrapychat-auth:${TAG}\"" k8s/auth/deployment.yaml
          yq -i ".spec.template.spec.initContainers[0].image = \"ghcr.io/hridaya2004/scrapychat/scrapychat-migrate:${TAG}\"" k8s/auth/deployment.yaml
          yq -i ".spec.template.spec.containers[0].image = \"ghcr.io/hridaya2004/scrapychat/scrapychat-backend:${TAG}\"" k8s/backend/deployment.yaml

      - name: Commit to repo
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          commit_message: 'k8s: Bump images to ${{ needs.prepare.outputs.tag }} [no ci]'
          file_pattern: 'k8s/**/deployment.yaml'
