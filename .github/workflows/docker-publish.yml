name: Publish Docker Images

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: web
            context: .
            dockerfile: apps/web/Dockerfile
          - name: auth
            context: .
            dockerfile: apps/auth/Dockerfile
          - name: migrate
            context: .
            dockerfile: apps/auth/Dockerfile.migrate
          - name: backend
            context: .
            dockerfile: apps/backend/Dockerfile

    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract version from tag
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
      - name: Compute image tag
        id: image_tag
        run: echo "value=${{ steps.version.outputs.value }}-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/scrapychat-${{ matrix.service.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=match,pattern=^v?(.*)$,group=1
            type=sha,format=short
            type=raw,value=${{ steps.image_tag.outputs.value }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          push: true
          build-args: |
            APP_VERSION=${{ steps.version.outputs.value }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}

  update-manifests:
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Extract version from tag
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Compute image tag
        id: image_tag
        run: echo "value=${{ steps.version.outputs.value }}-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Update image tags
        run: |
          yq -i ".spec.template.spec.containers[0].image = \"ghcr.io/hridaya2004/scrapychat/scrapychat-web:${{ steps.image_tag.outputs.value }}\"" k8s/web/deployment.yaml
          yq -i ".spec.template.spec.containers[0].image = \"ghcr.io/hridaya2004/scrapychat/scrapychat-auth:${{ steps.image_tag.outputs.value }}\"" k8s/auth/deployment.yaml
          yq -i ".spec.template.spec.initContainers[0].image = \"ghcr.io/hridaya2004/scrapychat/scrapychat-migrate:${{ steps.image_tag.outputs.value }}\"" k8s/auth/deployment.yaml
          yq -i ".spec.template.spec.containers[0].image = \"ghcr.io/hridaya2004/scrapychat/scrapychat-backend:${{ steps.image_tag.outputs.value }}\"" k8s/backend/deployment.yaml

      - name: Commit to repo
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          commit_message: 'k8s: Bump images to ${{ steps.image_tag.outputs.value }} [no ci]'
          file_pattern: 'k8s/**/deployment.yaml'
